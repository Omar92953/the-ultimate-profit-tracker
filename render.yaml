# Render Blueprint for Ultimate Profit Tracker. Nothing is created until you apply it in Render.
# Both services are paid "starter" plans (no sleeping). Ask before creating them.
services:
  - type: web
    name: ultimate-profit-tracker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:production
    startCommand: npm run start:production
    healthCheckPath: /
    envVars: &env
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: INLINE_WORKER
        value: "0"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_customers,read_inventory,read_orders,read_products
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
  - type: worker
    name: ultimate-profit-tracker-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run worker:production
    envVars: *env
