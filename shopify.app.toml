# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ef45d453a70e32cf5e01e1252fc230b0"
name = "Ultimate Profit Tracker"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# Why each scope is needed: docs/scopes.md.
# read_all_orders is added after Shopify approves the request (see docs/scopes.md); until then
# Shopify only returns the last 60 days of orders.
scopes = "read_customers,read_inventory,read_orders,read_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Orders, refunds and costs keep every order's profit current. Each one queues a small job.
  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/cancelled", "orders/delete", "refunds/create" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update", "inventory_items/update" ]
  uri = "/webhooks/catalog"

  [[webhooks.subscriptions]]
  topics = [ "bulk_operations/finish" ]
  uri = "/webhooks/bulk"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false
